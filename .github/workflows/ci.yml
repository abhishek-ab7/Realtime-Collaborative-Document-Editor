name: CI

on:
  push:
    branches: [main, phase-05-complete]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://trjloubazxygxfhxbtey.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_M8r81tkCGqXhkf4ma5KuyA_mUizXIQZ
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collabdoc
          POSTGRES_PASSWORD: collabdoc_dev_password
          POSTGRES_DB: collabdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd packages/database && npx prisma generate

      - name: Run Prisma Migrations
        run: cd packages/database && npx prisma migrate deploy && npx prisma db seed
        env:
          DATABASE_URL: postgresql://collabdoc:collabdoc_dev_password@localhost:5432/collabdoc?schema=public

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Unit & Integration Tests
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://collabdoc:collabdoc_dev_password@localhost:5432/collabdoc?schema=public

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: abhishek-ab7/Realtime-Collaborative-Document-Editor

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: abhishek-ab7/Realtime-Collaborative-Document-Editor

#       - name: Install Playwright Browsers
#         run: npx playwright install --with-deps
#
#       - name: Run Playwright E2E Tests
#         run: npm run test:e2e
#         env:
#           DATABASE_URL: postgresql://collabdoc:collabdoc_dev_password@localhost:5432/collabdoc?schema=public

      - name: Run TestSprite Automated Testing
        if: ${{ env.TESTSPRITE_API_KEY != '' }}
        env:
          API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          DATABASE_URL: postgresql://collabdoc:collabdoc_dev_password@localhost:5432/collabdoc?schema=public
        run: |
          mkdir -p testsprite_tests/tmp
          cat <<EOF > testsprite_tests/tmp/config.json
          {
            "status": "commited",
            "type": "backend",
            "scope": "codebase",
            "localEndpoint": "http://localhost:3000",
            "backendAuthType": "public",
            "loginUser": "testsprite@example.com",
            "loginPassword": "TestPassword123!",
            "executionArgs": {
              "projectName": "Realtime Collaborative Document Editor",
              "projectPath": "$GITHUB_WORKSPACE",
              "testIds": [],
              "additionalInstruction": "",
              "serverMode": "development",
              "envs": {
                "API_KEY": "$API_KEY"
              }
            },
            "serverPort": 45587
          }
          EOF
          npm run dev &
          echo "Waiting for localhost:3000 to be active..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done
          npx @testsprite/testsprite-mcp@latest generateCodeAndExecute

